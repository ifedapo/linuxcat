server {
    listen 80;
    listen [::]:80;

    server_name linuxcat.site www.linuxcat.site;

    root /var/www/linuxcat;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/linuxcat_access.log;
    error_log /var/log/nginx/linuxcat_error.log;
}
